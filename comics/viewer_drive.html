<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>만화 뷰어 (구글 드라이브 연동형)</title>
    <style>
      body {
        background-color: #1a1a1a;
        color: #eee;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: sans-serif;
        overflow-x: hidden;
      }

      /* 🚀 브라우저 확대 시 크기 고정을 위한 래퍼 (기준점 왼쪽 위로 고정) */
      #controls {
        width: 100%;
        max-width: 1200px;
        padding: 10px 15px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        transform-origin: top center;
        }

        #controls {
        width: 100%;
        max-width: 1200px;
        padding: 8px 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        }

        #viewer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        margin-top: 85px; /* 고정된 컨트롤 바 높이에 맞춘 여백 */
        transition: filter 0.1s ease-out;
        }

      .btn {
        padding: 5px 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
      }
      .btn:hover {
        background: #0056b3;
      }
      #btnDriveLogin {
        background-color: #4285f4;
        font-size: 13px;
        padding: 6px 14px;
      }

      .select-group {
        display: none;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      select {
        padding: 5px;
        font-size: 12px;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
        max-width: 180px;
      }

      .slider-group {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
      }
      .slider-group label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      
      input[type="range"] {
        width: 75px;
      }

      #viewer img {
        max-width: 100%;
        height: auto;
        image-rendering: -webkit-optimize-contrast;
        margin-bottom: -1px;
      }

      #scrollDownBtn,
      #scrollupBtn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: rgba(255, 152, 0, 0.8);
        color: white;
        border: none;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #scrollupBtn {
        bottom: 90px;
      }
    </style>
  </head>
  <body>
    <svg style="display: none">
      <defs>
        <filter id="sharpenFilter">
          <feConvolveMatrix
            id="sharpenMatrix"
            order="3"
            preserveAlpha="true"
            kernelMatrix="0 0 0 0 1 0 0 0 0"
          />
        </filter>
      </defs>
    </svg>

    <div id="control-wrapper">
      <div id="controls">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;">
          <button class="btn" id="btnDriveLogin">🔑 구글 드라이브 로그인</button>

          <span id="loadingStatus" style="color: #ff9800; font-weight: bold; font-size: 12px; display: none;"></span>

          <div class="select-group" id="selectContainer">
            <label style="font-size: 11px; font-weight: bold">작품:</label>
            <select id="parentFolderSelect">
              <option value="">-- 작품 폴더 선택 --</option>
            </select>

            <label style="font-size: 11px; font-weight: bold">권:</label>
            <select id="subFolderSelect">
              <option value="">-- 작품을 먼저 선택하세요 --</option>
            </select>

            <button class="btn" id="btnLoadImages">불러오기</button>
          </div>
        </div>

        <div class="slider-group">
          <label
            >명도:
            <input
              type="range"
              id="valBrightness"
              min="50"
              max="150"
              value="100"
            />
            <span id="txtBrightness">100%</span></label
          >
          <label
            >대비:
            <input type="range" id="valContrast" min="50" max="200" value="100" />
            <span id="txtContrast">100%</span></label
          >
          <label style="color: #ff9800; font-weight: bold"
            >샤픈:
            <input type="range" id="valSharpen" min="0" max="100" value="0" />
            <span id="txtSharpen">0%</span></label
          >
          <button
            onclick="resetFilters()"
            style="padding: 2px 5px; cursor: pointer; font-size: 11px;"
          >
            초기화
          </button>
        </div>
      </div>
    </div>

    <div id="viewer"></div>

    <button id="scrollupBtn">▲</button>
    <button id="scrollDownBtn">▼</button>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <script>
      function isMobileDevice() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      function adjustZoomCompensation() {
        // 🚀 스마트폰이나 태블릿 같은 모바일 기기에서는 축소 보정을 적용하지 않고 원래 크기로 유지
        if (isMobileDevice()) {
          const controlsEl = document.getElementById("controls");
          const wrapperEl = document.getElementById("control-wrapper");
          controlsEl.style.transform = "scale(1)";
          wrapperEl.style.height = "auto";
          return;
        }

        // PC(데스크톱) 브라우저 확대(줌) 보정 로직
        const zoomFactor = window.devicePixelRatio || 1;
        const controlsEl = document.getElementById("controls");
        const wrapperEl = document.getElementById("control-wrapper");
        
        if (zoomFactor > 1) {
          const scaleVal = 1 / zoomFactor;
          controlsEl.style.transform = `scale(${scaleVal})`;
          const baseHeight = 90; 
          wrapperEl.style.height = `${baseHeight * scaleVal}px`;
        } else {
          controlsEl.style.transform = "scale(1)";
          wrapperEl.style.height = "auto";
        }
      }

    //   window.addEventListener("resize", adjustZoomCompensation);
    //   window.addEventListener("load", adjustZoomCompensation);
    //   setInterval(adjustZoomCompensation, 500);

      const CLIENT_ID =
        "390191011438-nkn16tv7dnc167fukr55crl0domhsgcf.apps.googleusercontent.com";
      const API_KEY = "";
      const SCOPES = "https://www.googleapis.com/auth/drive.readonly";

      let tokenClient;
      let accessToken = null;

      const btnDriveLogin = document.getElementById("btnDriveLogin");
      const selectContainer = document.getElementById("selectContainer");
      const parentFolderSelect = document.getElementById("parentFolderSelect");
      const subFolderSelect = document.getElementById("subFolderSelect");
      const btnLoadImages = document.getElementById("btnLoadImages");
      const viewer = document.getElementById("viewer");
      const loadingStatus = document.getElementById("loadingStatus");

      var isMobile = {
        Android: function () { return /Android/i.test(navigator.userAgent); },
        BlackBerry: function () { return /BlackBerry/i.test(navigator.userAgent); },
        iOS: function () { return /iPhone|iPad|iPod/i.test(navigator.userAgent); },
        Windows: function () { return /IEMobile/i.test(navigator.userAgent); },
        any: function () {
          return (isMobile.Android() || isMobile.BlackBerry() || isMobile.iOS() || isMobile.Windows());
        }
      };

      if (isMobile.any()) {
        const sDown = document.getElementById("scrollDownBtn");
        const sUp = document.getElementById("scrollupBtn");
        if(sDown) sDown.style.display = "none";
        if(sUp) sUp.style.display = "none";
      }

      window.onload = () => {
        adjustZoomCompensation();
        gapi.load("client", () => {
          gapi.client
            .init({
              apiKey: API_KEY,
              discoveryDocs: [
                "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest",
              ],
            })
            .then(() => {
              console.log("GAPI 초기화 완료");
            });
        });

        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: (resp) => {
            if (resp.error !== undefined) {
              alert("로그인 실패: " + resp.message);
              return;
            }
            accessToken = resp.access_token;
            btnDriveLogin.innerText = "✅ 드라이브 연동됨";
            btnDriveLogin.style.backgroundColor = "#28a745";
            selectContainer.style.display = "flex";
            findComicRootFolder();
          },
        });
      };

      btnDriveLogin.onclick = () => {
        tokenClient.requestAccessToken({ prompt: "consent" });
      };

      async function findComicRootFolder() {
        try {
          const query =
            "name = '만화' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";
          const response = await gapi.client.drive.files.list({
            q: query,
            pageSize: 5,
          });
          const folders = response.result.files;

          if (folders.length === 0) {
            alert("구글 드라이브에 '만화' 폴더가 없습니다.");
            return;
          }
          loadParentFolders(folders[0].id);
        } catch (err) {
          console.error("만화 폴더 탐색 에러:", err);
        }
      }

      async function loadParentFolders(comicRootId) {
        try {
          const query = `'${comicRootId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
          const response = await gapi.client.drive.files.list({
            q: query,
            orderBy: "name_natural",
            pageSize: 100,
          });
          parentFolderSelect.innerHTML =
            '<option value="">-- 작품 폴더 선택 --</option>';
          response.result.files.forEach((folder) => {
            const opt = document.createElement("option");
            opt.value = folder.id;
            opt.innerText = folder.name;
            parentFolderSelect.appendChild(opt);
          });
        } catch (err) {
          console.error("작품 폴더 로드 에러:", err);
        }
      }

      parentFolderSelect.onchange = async () => {
        const parentId = parentFolderSelect.value;
        subFolderSelect.innerHTML = '<option value="">-- 권 선택 --</option>';
        if (!parentId) return;

        try {
          const query = `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
          const response = await gapi.client.drive.files.list({
            q: query,
            orderBy: "name_natural",
            pageSize: 100,
          });
          response.result.files.forEach((folder) => {
            const opt = document.createElement("option");
            opt.value = folder.id;
            opt.innerText = folder.name;
            subFolderSelect.appendChild(opt);
          });
        } catch (err) {
          console.error("권 폴더 로드 에러:", err);
        }
      };

      btnLoadImages.onclick = async () => {
        const selectedFolderId = subFolderSelect.value;
        if (!selectedFolderId) {
          alert("불러올 권 폴더를 선택해주세요.");
          return;
        }

        viewer.innerHTML = ""; 
        loadingStatus.style.display = "inline-block";
        loadingStatus.innerText = "🔍 이미지 목록 확인 중...";

        try {
          const query = `'${selectedFolderId}' in parents and mimeType contains 'image/' and trashed = false`;
          const response = await gapi.client.drive.files.list({
            q: query,
            orderBy: "name_natural",
            pageSize: 500,
            fields: "files(id, name)",
          });

          const files = response.result.files;
          const totalFiles = files.length;

          if (totalFiles === 0) {
            loadingStatus.style.display = "none";
            viewer.innerHTML = "<p style='padding: 20px;'>선택한 폴더에 이미지 파일이 없습니다.</p>";
            return;
          }

          updateFilters();

          for (let i = 0; i < totalFiles; i++) {
            const file = files[i];
            const currentPercent = Math.round(((i + 1) / totalFiles) * 100);
            
            loadingStatus.innerText = `📖 로딩 중 (${i + 1}/${totalFiles} - ${currentPercent}%)`;

            try {
              const imgResponse = await fetch(
                `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
                {
                  headers: { Authorization: `Bearer ${accessToken}` },
                },
              );

              if (imgResponse.ok) {
                const blob = await imgResponse.blob();
                const img = document.createElement("img");
                img.src = URL.createObjectURL(blob);
                viewer.appendChild(img); 
              }
            } catch (e) {
              console.error(`이미지 로드 실패 [${file.name}]:`, e);
            }
          }

          loadingStatus.style.display = "none";

        } catch (err) {
          console.error("이미지 전체 로드 에러:", err);
          loadingStatus.style.display = "none";
          alert("이미지를 불러오는 중 문제가 발생했습니다.");
        }
      };

      var showControl = true;
      document.addEventListener("click", (e) => {
        if (
          e.target.closest("#control-wrapper") ||
          e.target.closest("#scrollDownBtn" ||
          e.target.closest("#scrollupBtn"))
        )
          return;
        if (showControl)
          document.querySelector("#control-wrapper").style.display = "none";
        else document.querySelector("#control-wrapper").style.display = "flex";
        showControl = !showControl;
      });

      const sharpenMatrix = document.getElementById("sharpenMatrix");

      const updateFilters = () => {
        const b = document.getElementById("valBrightness").value;
        const c = document.getElementById("valContrast").value;
        const sh = parseInt(document.getElementById("valSharpen").value, 10);

        document.getElementById("txtBrightness").innerText = b + "%";
        document.getElementById("txtContrast").innerText = c + "%";
        document.getElementById("txtSharpen").innerText = sh + "%";

        const amount = sh / 50;
        const center = 4 * amount + 1;
        const edge = -amount;

        sharpenMatrix.setAttribute(
          "kernelMatrix",
          `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`,
        );
        const svgFilter = sh > 0 ? `url(#sharpenFilter) ` : "";
        viewer.style.filter = `${svgFilter}brightness(${b}%) contrast(${c}%)`;
      };

      ["Brightness", "Contrast", "Sharpen"].forEach((type) => {
        document
          .getElementById(`val${type}`)
          .addEventListener("input", updateFilters);
      });

      window.resetFilters = () => {
        document.getElementById("valBrightness").value = 100;
        document.getElementById("valContrast").value = 100;
        document.getElementById("valSharpen").value = 0;
        updateFilters();
      };

      const scrollDownBtn = document.getElementById("scrollDownBtn");
      const scrollUpBtn = document.getElementById("scrollupBtn");
      let scrollReq;
      let arrow = "";

      const TheAutoScroll = () => {
        if (arrow === "up") window.scrollBy(0, -2);
        else window.scrollBy(0, 2);
        scrollReq = requestAnimationFrame(TheAutoScroll);
      };

      const stopScroll = () => {
        if (scrollReq) {
          cancelAnimationFrame(scrollReq);
          scrollReq = null;
        }
      };

      scrollDownBtn.addEventListener("mousedown", () => { arrow = "down"; if (!scrollReq) TheAutoScroll(); });
      scrollDownBtn.addEventListener("mouseup", stopScroll);
      scrollDownBtn.addEventListener("mouseleave", stopScroll);
      scrollDownBtn.addEventListener("touchstart", (e) => { arrow = "down"; e.preventDefault(); if (!scrollReq) TheAutoScroll(); });
      scrollDownBtn.addEventListener("touchend", stopScroll);

      scrollUpBtn.addEventListener("mousedown", () => { arrow = "up"; if (!scrollReq) TheAutoScroll(); });
      scrollUpBtn.addEventListener("mouseup", stopScroll);
      scrollUpBtn.addEventListener("mouseleave", stopScroll);
      scrollUpBtn.addEventListener("touchstart", (e) => { arrow = 'up'; e.preventDefault(); if (!scrollReq) TheAutoScroll(); });
      scrollUpBtn.addEventListener("touchend", stopScroll);
    </script>
  </body>
</html>
