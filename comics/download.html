<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만화 자동 다운로더 (폴더 지정형)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body {
    margin: 0;
    background-color: #1a1a1a;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #panel {
    padding: 15px;
    background: #000;
    display: flex;
    gap: 15px;
    align-items: center;
    border-bottom: 2px solid #333;
    flex-wrap: wrap;
  }
  
  .input-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    font-weight: bold;
  }
  .input-group input {
    padding: 8px;
    font-size: 14px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: white;
  }
  .input-group input:disabled {
    background: #222;
    color: #888;
  }
  
  #targetUrl { width: 300px; }
  #saveName { width: 120px; }
  #startNum { width: 60px; text-align: center; }

  button {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    border-radius: 4px;
  }
  #btnSelectFolder { background-color: #2196f3; color: white; }
  #btnStart { background-color: #4caf50; color: white; }
  #btnStop { background-color: #f44336; color: white; display: none; }
  
  .folder-info {
    font-size: 14px;
    color: #ffeb3b;
    font-weight: bold;
  }

  #logArea {
    flex-grow: 1;
    color: #00ff00;
    font-family: monospace;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #viewerFrame {
    flex-grow: 1;
    border: none;
    width: 100%;
    background-color: #fff;
  }
</style>
</head>
<body>

  <div id="panel">
    <!-- ⬇️ 폴더 선택 UI 추가 -->
    <button id="btnSelectFolder">📁 저장 폴더 선택</button>
    <span class="folder-info" id="folderNameDisplay">선택된 폴더 없음 (기본 다운로드 폴더 사용)</span>

    <div class="input-group">
      <label for="targetUrl">URL:</label>
      <input type="text" id="targetUrl" value="https://update.spotv24.com/">
    </div>

    <div class="input-group">
      <label for="saveName">이름:</label>
      <input type="text" id="saveName" value="book">
    </div>
    <div class="input-group">
      <label for="startNum">화수:</label>
      <input type="number" id="startNum" value="1" min="1">
    </div>
    
    <button id="btnStart">▶ 자동 다운로드 시작</button>
    <button id="btnStop">■ 중지</button>
    <div id="logArea">대기 중...</div>
  </div>

  <iframe id="viewerFrame" src="about:blank"></iframe>

<script>
  const iframe = document.getElementById('viewerFrame');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnSelectFolder = document.getElementById('btnSelectFolder');
  const folderNameDisplay = document.getElementById('folderNameDisplay');
  const logArea = document.getElementById('logArea');
  
  const targetUrlInput = document.getElementById('targetUrl');
  const saveNameInput = document.getElementById('saveName');
  const startNumInput = document.getElementById('startNum');
  
  let isRunning = false;
  let episodeCount = 1;
  let directoryHandle = null; // 사용자가 선택한 폴더 핸들 저장 변수

  function log(msg) {
    console.log(msg);
    logArea.innerText = msg;
  }

  // ⬇️ 폴더 선택 버튼 이벤트 (File System Access API)
  btnSelectFolder.addEventListener('click', async () => {
    try {
      directoryHandle = await window.showDirectoryPicker();
      folderNameDisplay.innerText = `📁 선택됨: ${directoryHandle.name}`;
      log(`저장 폴더가 '${directoryHandle.name}'(으)로 설정되었습니다.`);
    } catch (e) {
      log('폴더 선택이 취소되었습니다.');
    }
  });

  async function scrollIframe(iframeWindow, iframeDoc) {
    log('지연 로딩 해제 중 (스크롤 다운)...');
    const scrollHeight = iframeDoc.body.scrollHeight;
    
    for(let y = 0; y < scrollHeight; y += 800) {
      iframeWindow.scrollTo(0, y);
      await new Promise(r => setTimeout(r, 200)); 
    }
    await new Promise(r => setTimeout(r, 1500));
  }

  async function processCurrentEpisode() {
    if (!isRunning) return;

    try {
      const iframeWindow = iframe.contentWindow;
      const iframeDoc = iframe.contentDocument || iframeWindow.document;

      await scrollIframe(iframeWindow, iframeDoc);

      const canvases = Array.from(iframeDoc.querySelectorAll('canvas'));
      if (canvases.length === 0) {
        log('⚠️ 캔버스를 찾을 수 없거나 아직 로딩 중입니다. 3초 후 재시도합니다.');
        setTimeout(processCurrentEpisode, 3000);
        return;
      }

      log(`총 ${canvases.length}장의 캔버스 추출 중... ZIP 압축 준비`);

      const zip = new JSZip();
      canvases.forEach((canvas, idx) => {
        const dataUrl = canvas.toDataURL('image/png'); 
        const base64Data = dataUrl.split(',')[1];
        const fileName = String(idx + 1).padStart(3, '0') + '.png';
        zip.file(fileName, base64Data, {base64: true});
      });

      log(`에피소드 ${episodeCount} 압축 중...`);
      const content = await zip.generateAsync({ type: 'blob' });
      
      const prefix = saveNameInput.value.trim() || 'comic';
      const finalFileName = `${prefix}_${episodeCount}.zip`;
      
      // ⬇️ 파일 저장 로직 분기
      if (directoryHandle) {
        // 지정된 폴더가 있을 경우: File System API를 통해 직접 쓰기
        const fileHandle = await directoryHandle.getFileHandle(finalFileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        log(`📁 [${directoryHandle.name}] 폴더에 저장 완료: ${finalFileName}`);
      } else {
        // 지정된 폴더가 없을 경우: 기존 방식(브라우저 기본 다운로드) 사용
        const zipUrl = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = zipUrl;
        a.download = finalFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(zipUrl);
        log(`기본 다운로드 폴더에 저장 완료: ${finalFileName}`);
      }

      episodeCount++;
      startNumInput.value = episodeCount;
      
      log('✅ 다운로드 완료! 다음 화 확인 중...');

      const nextBtn = iframeDoc.querySelector('.right-episode.next');
      
      if (nextBtn && nextBtn.dataset.locked !== "true" && !nextBtn.disabled) {
        log('➡️ 다음 화로 이동합니다.');
        nextBtn.click(); 
      } else {
        log('🎉 다음 화가 없습니다. 모든 다운로드가 완료되었습니다!');
        isRunning = false;
        toggleButtons();
      }

    } catch (e) {
      log('❌ 에러 발생: ' + e.message);
      isRunning = false;
      toggleButtons();
    }
  }

  function toggleButtons() {
    btnStart.style.display = isRunning ? 'none' : 'inline-block';
    btnStop.style.display = isRunning ? 'inline-block' : 'none';
    
    targetUrlInput.disabled = isRunning;
    saveNameInput.disabled = isRunning;
    startNumInput.disabled = isRunning;
    btnSelectFolder.disabled = isRunning; // 실행 중 폴더 변경 방지
  }

  btnStart.addEventListener('click', () => {
    episodeCount = parseInt(startNumInput.value, 10) || 1;
    const url = targetUrlInput.value.trim();
    
    if (!url) {
      alert('시작 URL을 입력해주세요.');
      return;
    }

    isRunning = true;
    toggleButtons();
    
    if (iframe.src !== url && iframe.src !== url + '/') {
      log('새로운 URL을 로드합니다...');
      iframe.src = url;
    } else {
      processCurrentEpisode();
    }
  });

  btnStop.addEventListener('click', () => {
    isRunning = false;
    toggleButtons();
    log('🛑 사용자에 의해 중지되었습니다.');
  });

  iframe.addEventListener('load', () => {
    if (isRunning && iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
      log('페이지 로드 완료. 3초 후 이미지 추출을 시작합니다...');
      setTimeout(processCurrentEpisode, 3000); 
    }
  });
</script>

</body>
</html>
