<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만화 자동 다운로더 (UX 개선형)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body {
    margin: 0;
    background-color: #1a1a1a;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #panel {
    padding: 15px;
    background: #000;
    display: flex;
    gap: 15px;
    align-items: center;
    border-bottom: 2px solid #333;
    flex-wrap: wrap;
  }
  
  .input-group {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
    font-weight: bold;
  }
  .input-group input {
    padding: 8px;
    font-size: 14px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #333;
    color: white;
  }
  .input-group input:disabled {
    background: #222;
    color: #888;
  }
  
  #targetUrl { width: 250px; }
  #saveName { width: 100px; }
  #startNum { width: 60px; text-align: center; }

  button {
    padding: 8px 15px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    color: white;
  }
  #btnLoadPage { background-color: #ff9800; } /* 페이지 연결 버튼 색상 */
  #btnSelectFolder { background-color: #2196f3; }
  #btnStart { background-color: #4caf50; padding: 10px 20px; }
  #btnStop { background-color: #f44336; padding: 10px 20px; display: none; }
  
  .folder-info {
    font-size: 14px;
    color: #ffeb3b;
    font-weight: bold;
  }

  #logArea {
    flex-grow: 1;
    color: #00ff00;
    font-family: monospace;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #viewerFrame {
    flex-grow: 1;
    border: none;
    width: 100%;
    background-color: #fff;
  }
</style>
</head>
<body>

  <div id="panel">
    <!-- ⬇️ 기능 1: URL 연결부 독립 -->
    <div class="input-group">
      <label for="targetUrl">URL:</label>
      <input type="text" id="targetUrl" value="https://update.spotv24.com/">
      <button id="btnLoadPage">🌐 연결</button>
    </div>

    <!-- ⬇️ 기능 2: 폴더 설정 -->
    <button id="btnSelectFolder">📁 폴더 지정</button>
    
    <!-- ⬇️ 기능 3: 다운로드 설정 -->
    <div class="input-group">
      <label for="saveName">이름:</label>
      <input type="text" id="saveName" value="book">
    </div>
    <div class="input-group">
      <label for="startNum">화수:</label>
      <input type="number" id="startNum" value="1" min="1">
    </div>
    
    <!-- ⬇️ 기능 4: 실행 컨트롤러 -->
    <button id="btnStart">▶ 봇 시작</button>
    <button id="btnStop">■ 중지</button>
    
    <div id="logArea">대기 중... (먼저 '연결' 버튼을 눌러주세요)</div>
  </div>

  <iframe id="viewerFrame" src="about:blank"></iframe>

<script>
  const iframe = document.getElementById('viewerFrame');
  const btnLoadPage = document.getElementById('btnLoadPage');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnSelectFolder = document.getElementById('btnSelectFolder');
  const logArea = document.getElementById('logArea');
  
  const targetUrlInput = document.getElementById('targetUrl');
  const saveNameInput = document.getElementById('saveName');
  const startNumInput = document.getElementById('startNum');
  
  let isRunning = false;
  let episodeCount = 1;
  let directoryHandle = null; 

  function log(msg) {
    console.log(msg);
    logArea.innerText = msg;
  }

  // 1. 수동 연결 버튼 이벤트
  btnLoadPage.addEventListener('click', () => {
    const url = targetUrlInput.value.trim();
    if (!url) {
      alert('연결할 URL을 입력해주세요.');
      return;
    }
    log('로딩 중... 화면이 보일 때까지 대기해주세요.');
    iframe.src = url;
  });

  // 2. 폴더 선택 버튼 이벤트
  btnSelectFolder.addEventListener('click', async () => {
    try {
      directoryHandle = await window.showDirectoryPicker();
      btnSelectFolder.innerText = `📁 ${directoryHandle.name}`;
      log(`저장 폴더가 '${directoryHandle.name}'(으)로 설정되었습니다.`);
    } catch (e) {
      log('폴더 선택이 취소되었습니다.');
    }
  });

  async function scrollIframe(iframeWindow, iframeDoc) {
    log('지연 로딩 해제 중 (스크롤 다운)...');
    const scrollHeight = iframeDoc.body.scrollHeight;
    
    for(let y = 0; y < scrollHeight; y += 800) {
      iframeWindow.scrollTo(0, y);
      await new Promise(r => setTimeout(r, 200)); 
    }
    await new Promise(r => setTimeout(r, 1500));
  }

  async function processCurrentEpisode() {
    if (!isRunning) return;

    try {
      const iframeWindow = iframe.contentWindow;
      const iframeDoc = iframe.contentDocument || iframeWindow.document;

      await scrollIframe(iframeWindow, iframeDoc);

      const canvases = Array.from(iframeDoc.querySelectorAll('canvas'));
      if (canvases.length === 0) {
        log('⚠️ 캔버스를 찾을 수 없거나 로딩 오류입니다. 3초 후 재시도합니다.');
        setTimeout(processCurrentEpisode, 3000);
        return;
      }

      log(`총 ${canvases.length}장의 이미지(캔버스) ZIP 압축 중...`);

      const zip = new JSZip();
      canvases.forEach((canvas, idx) => {
        const dataUrl = canvas.toDataURL('image/png'); 
        const base64Data = dataUrl.split(',')[1];
        const fileName = String(idx + 1).padStart(3, '0') + '.png';
        zip.file(fileName, base64Data, {base64: true});
      });

      const content = await zip.generateAsync({ type: 'blob' });
      const prefix = saveNameInput.value.trim() || 'comic';
      const finalFileName = `${prefix}_${episodeCount}.zip`;
      
      if (directoryHandle) {
        const fileHandle = await directoryHandle.getFileHandle(finalFileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        log(`📁 저장 완료: ${finalFileName}`);
      } else {
        const zipUrl = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = zipUrl;
        a.download = finalFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(zipUrl);
        log(`저장 완료: ${finalFileName}`);
      }

      episodeCount++;
      startNumInput.value = episodeCount;
      
      log('✅ 다음 화 버튼 탐색 중...');

      const nextBtn = iframeDoc.querySelector('.right-episode.next');
      
      if (nextBtn && nextBtn.dataset.locked !== "true" && !nextBtn.disabled) {
        log('➡️ 다음 화로 이동합니다.');
        nextBtn.click(); 
      } else {
        log('🎉 다음 화가 없습니다. 모든 다운로드가 완료되었습니다!');
        isRunning = false;
        toggleButtons();
      }

    } catch (e) {
      log('❌ 에러 발생: ' + e.message);
      isRunning = false;
      toggleButtons();
    }
  }

  function toggleButtons() {
    btnStart.style.display = isRunning ? 'none' : 'inline-block';
    btnStop.style.display = isRunning ? 'inline-block' : 'none';
    
    targetUrlInput.disabled = isRunning;
    btnLoadPage.disabled = isRunning;
    saveNameInput.disabled = isRunning;
    startNumInput.disabled = isRunning;
    btnSelectFolder.disabled = isRunning;
  }

  // 3. 자동 다운로드 봇 시작
  btnStart.addEventListener('click', () => {
    // iframe이 비어있는 상태에서 봇을 시작하려 할 경우 차단
    if (iframe.src === 'about:blank' || iframe.src === window.location.href) {
      alert("먼저 '🌐 연결' 버튼을 눌러 만화 페이지를 띄워주세요!");
      return;
    }

    episodeCount = parseInt(startNumInput.value, 10) || 1;
    isRunning = true;
    toggleButtons();
    
    log('▶ 봇 구동 시작! 이미지 추출을 시도합니다.');
    processCurrentEpisode();
  });

  btnStop.addEventListener('click', () => {
    isRunning = false;
    toggleButtons();
    log('🛑 사용자에 의해 봇이 중지되었습니다.');
  });

  // 4. 페이지 이동 완료 이벤트
  iframe.addEventListener('load', () => {
    if (iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
      if (isRunning) {
        // 봇이 구동 중일 때(다음 화로 넘어갔을 때)
        log('새 에피소드 로드 완료. 3초 후 이미지 추출을 시작합니다...');
        setTimeout(processCurrentEpisode, 3000); 
      } else {
        // 수동으로 '연결' 버튼을 눌러서 로드되었을 때
        log('🌐 페이지 연결 완료! 이제 다운로드를 시작할 수 있습니다.');
      }
    }
  });
</script>

</body>
</html>
